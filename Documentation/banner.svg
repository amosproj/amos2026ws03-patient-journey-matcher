<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="b1-title b1-desc">
  <title id="b1-title">Patient Journey Matcher</title>
  <desc id="b1-desc">A patient journey goes to the MCP server with match_journey; the keyword, graph and AI summary approaches match it, and the best matches come back: papers, preprints, videos and podcast episodes.</desc>
  <defs><marker id="b1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d5f8a"/></marker></defs>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="10" fill="#fafafa" stroke="#d0d7de"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">
    <text x="32" y="38" font-size="11" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">PATIENT JOURNEY</text>
    <text x="344" y="38" font-size="11" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">THREE APPROACHES</text>
    <text x="866" y="38" font-size="11" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">BEST MATCHES</text>
    <line x1="44" y1="118" x2="226" y2="118" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="48" cy="118" r="5" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
    <circle cx="108" cy="118" r="5" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
    <circle cx="168" cy="118" r="5" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
    <circle cx="228" cy="118" r="7" fill="#1f2328"/>
    <text x="44" y="148" font-size="14">Dated events</text>
    <text x="44" y="167" font-size="12" fill="#57606a">the latest one counts</text>
    <line x1="244" y1="118" x2="336" y2="118" stroke="#1d5f8a" stroke-width="1.6" marker-end="url(#b1-arrow)"/>
    <text x="290" y="108" font-size="11" fill="#1d5f8a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">match_journey</text>
    <rect x="344" y="60" width="420" height="36" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="364" cy="76" r="5.5" fill="none" stroke="#1f2328" stroke-width="1.6"/><line x1="368" y1="80" x2="373" y2="85" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"/>
    <text x="386" y="83" font-size="14" font-weight="600">Keyword</text>
    <text x="478" y="83" font-size="12.5" fill="#57606a">BM25 over the words of each source</text>
    <rect x="344" y="100" width="420" height="36" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="359" y1="123" x2="366" y2="112" stroke="#1f2328" stroke-width="1.4"/><line x1="366" y1="112" x2="373" y2="123" stroke="#1f2328" stroke-width="1.4"/><line x1="359" y1="123" x2="373" y2="123" stroke="#1f2328" stroke-width="1.4"/><circle cx="359" cy="123" r="3" fill="#1f2328"/><circle cx="366" cy="112" r="3" fill="#1f2328"/><circle cx="373" cy="123" r="3" fill="#1f2328"/>
    <text x="386" y="123" font-size="14" font-weight="600">Graph</text>
    <text x="478" y="123" font-size="12.5" fill="#57606a">entities and relations from PubTator3</text>
    <rect x="344" y="140" width="420" height="36" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <path d="M366,150 Q367.6,156.4 374,158 Q367.6,159.6 366,166 Q364.4,159.6 358,158 Q364.4,156.4 366,150 Z" fill="#1f2328"/>
    <text x="386" y="163" font-size="14" font-weight="600">AI summary</text>
    <text x="478" y="163" font-size="12.5" fill="#57606a">summaries and embeddings, vector search</text>
    <path d="M764,78 H776 a8,8 0 0 1 8,8 V118 M764,158 H776 a8,8 0 0 0 8,-8 V118 M764,118 H784" fill="none" stroke="#57606a" stroke-width="1.4"/>
    <line x1="784" y1="118" x2="856" y2="118" stroke="#1d5f8a" stroke-width="1.6" marker-end="url(#b1-arrow)"/>
    <rect x="866" y="80" width="146" height="34" rx="17" fill="#ffffff" stroke="#d0d7de"/>
    <text x="939" y="102" font-size="13.5" text-anchor="middle">Papers</text>
    <rect x="1022" y="80" width="146" height="34" rx="17" fill="#ffffff" stroke="#d0d7de"/>
    <text x="1095" y="102" font-size="13.5" text-anchor="middle">Preprints</text>
    <rect x="866" y="122" width="146" height="34" rx="17" fill="#ffffff" stroke="#d0d7de"/>
    <text x="939" y="144" font-size="13.5" text-anchor="middle">Videos</text>
    <rect x="1022" y="122" width="146" height="34" rx="17" fill="#ffffff" stroke="#d0d7de"/>
    <text x="1095" y="144" font-size="13.5" text-anchor="middle">Podcast episodes</text>
    <text x="1017" y="180" font-size="12" fill="#57606a" text-anchor="middle">with links to the originals</text>
  </g>
</svg>
