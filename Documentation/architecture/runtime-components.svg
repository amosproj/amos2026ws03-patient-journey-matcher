  <text class="lab" x="170" y="14" text-anchor="middle">INGESTION · BATCH JOBS</text>
  <text class="lab" x="485" y="14" text-anchor="middle">PERSISTENCE</text>
  <text class="lab" x="815" y="14" text-anchor="middle">QUERY · LONG-RUNNING SERVICE</text>

  <!-- top row -->
  <rect class="ext" x="20" y="26" width="300" height="110" rx="6"/>
  <g text-anchor="middle">
    <text class="h" x="170" y="50">Source APIs</text>
    <text class="b" x="170" y="72">PubMed E-utilities · arXiv API</text>
    <text class="b" x="170" y="90">YouTube Data API · Zenodo · podcast RSS</text>
    <text class="b" x="170" y="112">references: Europe PMC · Semantic Scholar</text>
  </g>

  <rect class="out" x="360" y="26" width="250" height="110" rx="6"/>
  <g text-anchor="middle">
    <text class="h" x="485" y="50">AIlixir app</text>
    <text class="sub" x="485" y="68">outside our system</text>
    <text class="b" x="485" y="90">patient-document pipeline</text>
    <text class="b" x="485" y="107">builds the patient journey</text>
    <text class="b" x="485" y="124">(SS26 copy in backend/)</text>
  </g>

  <rect class="cli" x="650" y="26" width="330" height="110" rx="6"/>
  <g text-anchor="middle">
    <text class="h" x="815" y="50">Clients</text>
    <text class="b" x="815" y="72">AIlixir app backend · production client</text>
    <text class="b" x="815" y="92">MCP Inspector · demo and manual tests</text>
    <text class="b" x="815" y="112">evaluation runner · test journeys (#11)</text>
  </g>
  <path class="e" d="M610 81 H650" marker-end="url(#a1)"/>

