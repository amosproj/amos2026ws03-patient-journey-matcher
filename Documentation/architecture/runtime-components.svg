  <rect class="ts" x="670" y="228" width="290" height="62" rx="5"/>
  <rect class="ts" x="670" y="316" width="140" height="80" rx="5"/>
  <rect class="ts" x="822" y="316" width="138" height="80" rx="5"/>
  <rect class="grp" x="670" y="548" width="290" height="244" rx="6"/>
