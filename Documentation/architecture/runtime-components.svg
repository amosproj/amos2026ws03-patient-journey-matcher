  <!-- bottom row -->
  <rect class="ext" x="20" y="906" width="130" height="80" rx="6"/>
  <rect class="ext" x="170" y="906" width="810" height="80" rx="6"/>
  <g text-anchor="middle">
    <text class="h" x="85" y="928">LLM API</text>
    <text class="b" x="85" y="946">summaries,</text>
