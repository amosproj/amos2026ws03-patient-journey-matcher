  <rect class="lane-ts" x="650" y="180" width="330" height="686" rx="8"/>

  <text class="lab" x="32" y="198">CRAWLER · PYTHON · CRAWLEE</text>
  <text class="sub" x="32" y="213">one container per source</text>
  <text class="lab" x="372" y="198">POSTGRESQL 18</text>
  <text class="sub" x="372" y="213">one server · Docker volume</text>
  <text class="lab" x="32" y="498">INDEXER · TYPESCRIPT</text>
  <text class="sub" x="32" y="513">runs after each crawl</text>
  <text class="lab" x="662" y="198">MCP SERVER · TYPESCRIPT</text>
  <text class="sub" x="662" y="213">Node.js 24 · Streamable HTTP</text>

  <!-- crawler -->
  <rect class="py" x="40" y="226" width="130" height="56" rx="5"/>
  <rect class="py" x="40" y="304" width="260" height="66" rx="5"/>
  <rect class="py" x="40" y="394" width="120" height="52" rx="5"/>
  <rect class="py" x="180" y="394" width="120" height="52" rx="5"/>
  <g text-anchor="middle">
