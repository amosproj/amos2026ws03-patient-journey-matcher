    <text class="b" x="815" y="617">BM25-style term ranking</text>
    <text class="h" x="815" y="674">graph matcher</text>
    <text class="b" x="815" y="693">concept and relation overlap</text>
    <text class="h" x="815" y="750">AI summary matcher</text>
    <text class="b" x="815" y="769">similarity to the summaries</text>
    <text class="hm" x="815" y="830">download()</text>
    <text class="b" x="815" y="848">on a match (<tspan class="mono">get_source</tspan>) · not stored</text>
  </g>
