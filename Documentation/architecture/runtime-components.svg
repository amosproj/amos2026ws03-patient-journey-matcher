    <text class="bm" x="815" y="266">match_journey · compare_algorithms</text>
    <text class="b" x="815" y="283"><tspan class="mono">get_source</tspan> · draft names (#7)</text>
    <text class="h" x="740" y="336">Result assembler</text>
    <text class="b" x="740" y="356">merge and rank</text>
    <text class="b" x="740" y="373">add metadata</text>
    <text class="b" x="740" y="390">and links</text>
    <text class="h" x="891" y="336">Journey reader</text>
    <text class="b" x="891" y="356">validate</text>
    <text class="b" x="891" y="373">focus: latest event</text>
    <text class="b" x="891" y="390">older: context</text>
