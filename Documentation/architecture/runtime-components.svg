  <rect class="ts" x="680" y="576" width="270" height="56" rx="5"/>
  <rect class="ts" x="680" y="652" width="270" height="56" rx="5"/>
  <rect class="ts" x="680" y="728" width="270" height="56" rx="5"/>
  <rect class="ts" x="670" y="812" width="290" height="44" rx="5"/>
  <g text-anchor="middle">
