  <rect class="db" x="380" y="576" width="210" height="56" rx="5"/>
  <rect class="db" x="380" y="652" width="210" height="56" rx="5"/>
  <rect class="db" x="380" y="728" width="210" height="56" rx="5"/>
  <text class="sub" x="372" y="566">three index schemas</text>
  <g text-anchor="middle">
    <text class="hm" x="485" y="244">crawl_runs</text>
    <text class="b" x="485" y="262">optional run log</text>
    <text class="hm" x="485" y="312">documents</text>
    <text class="b" x="485" y="334">metadata and links only</text>
    <text class="b" x="485" y="351">no full texts, PDFs</text>
    <text class="b" x="485" y="368">or transcripts</text>
    <text class="b" x="485" y="396">one writer: the crawler</text>
    <text class="b" x="485" y="413">readers: indexer, MCP server</text>
    <text class="h" x="485" y="598">keyword index</text>
    <text class="b" x="485" y="617">Postgres full-text search</text>
    <text class="h" x="485" y="674">graph index</text>
    <text class="b" x="485" y="693">concepts and relations</text>
    <text class="h" x="485" y="750">AI summary index</text>
    <text class="b" x="485" y="769">summaries and pgvector</text>
  </g>

  <!-- indexer -->
  <rect class="grp" x="34" y="548" width="212" height="244" rx="6"/>
