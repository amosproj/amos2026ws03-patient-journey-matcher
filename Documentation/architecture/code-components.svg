<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 796" width="1000" height="796" role="img" aria-label="Code components">
  <style>
    text { font-family: "Noto Sans", "Liberation Sans", Arial, sans-serif; }
    .mono { font-family: "Noto Sans Mono", "Liberation Mono", monospace; }
    .h { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .hm { font-size: 13.5px; font-weight: 700; fill: #1a1a1a; font-family: "Noto Sans Mono", "Liberation Mono", monospace; }
    .b { font-size: 12px; fill: #3d3d3d; }
    .bm { font-size: 11.5px; fill: #3d3d3d; font-family: "Noto Sans Mono", "Liberation Mono", monospace; }
    .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; fill: #555555; }
    .sub { font-size: 11px; fill: #6a6a6a; }
    .el { font-size: 11px; fill: #333333; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .dot { fill: #1d5f8a; }
    .py { fill: #fbf1e6; stroke: #a35a1a; stroke-width: 1.5; }
    .ts { fill: #eaf2f8; stroke: #1d5f8a; stroke-width: 1.5; }
    .alg { fill: #d6e7f3; stroke: #1d5f8a; stroke-width: 1.5; }
    .db { fill: #eef0f3; stroke: #4a5563; stroke-width: 1.5; }
    .db-opt { fill: #f8f9fa; stroke: #4a5563; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ctr { fill: #ffffff; stroke: #4a5563; stroke-width: 1.5; }
    .ext { fill: #ffffff; stroke: #7a7a7a; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .out { fill: #f4f4f4; stroke: #9a9a9a; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .cli { fill: #ffffff; stroke: #555555; stroke-width: 1.3; }
    .dev { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .fw { fill: #f3f3f3; stroke: #9a9a9a; stroke-width: 1.1; }
    .pf { fill: #e8e8e8; stroke: #8a8a8a; stroke-width: 1.1; }
    .lane-py { fill: #fffaf5; stroke: #dcb894; stroke-width: 1; }
    .lane-ts { fill: #f5f9fc; stroke: #a8c5da; stroke-width: 1; }
    .lane-db { fill: #f6f7f9; stroke: #b9c0c9; stroke-width: 1; }
    .grp { fill: none; stroke: #8fb0c8; stroke-width: 1; stroke-dasharray: 4 3; }
    .e { fill: none; stroke: #3a3a3a; stroke-width: 1.4; }
    .r { stroke-dasharray: 5 4; }
  </style>
  <rect width="1000" height="796" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#e2e2e2" stroke-width="2.4"/>
    </pattern>
  </defs>

  <text class="lab" x="34" y="14">APPLICATION LAYER · OUR CODE</text>
  <text class="sub" transform="translate(18 95) rotate(-90)" text-anchor="middle">interface</text>
  <text class="sub" transform="translate(18 233) rotate(-90)" text-anchor="middle">domain</text>
  <text class="sub" transform="translate(18 375) rotate(-90)" text-anchor="middle">infrastructure</text>

  <!-- crawler/ -->
  <rect class="lane-py" x="34" y="24" width="300" height="400" rx="8"/>
  <text x="46" y="46"><tspan class="hm">crawler/</tspan><tspan class="b"> · Python project (uv)</tspan></text>
  <rect class="py" x="50" y="64" width="268" height="62" rx="5"/>
  <rect class="py" x="50" y="148" width="268" height="82" rx="5"/>
  <rect class="py" x="50" y="246" width="128" height="72" rx="5"/>
  <rect class="py" x="192" y="246" width="126" height="72" rx="5"/>
  <rect class="py" x="50" y="344" width="268" height="62" rx="5"/>
  <g text-anchor="middle">
    <text class="hm" x="184" y="85">cli.py</text>
    <text class="b" x="184" y="103">one entry point per source</text>
    <text class="b" x="184" y="119">started by the scheduler</text>
    <text class="hm" x="184" y="168">sources/</text>
    <text class="b" x="184" y="186">pubmed · arxiv · youtube</text>
    <text class="b" x="184" y="202">zenodo · podcasts</text>
    <text class="b" x="184" y="219">one SourceScraper subclass each</text>
    <text class="hm" x="114" y="266">references/</text>
    <text class="b" x="114" y="285">link extractor</text>
    <text class="b" x="114" y="301">queue rules</text>
    <text class="hm" x="255" y="266">topics/</text>
    <text class="b" x="255" y="285">query YAML per</text>
    <text class="b" x="255" y="301">disease area</text>
    <text class="hm" x="184" y="366">store.py</text>
    <text class="b" x="184" y="384">upsert into documents</text>
    <text class="b" x="184" y="400">(asyncpg)</text>
  </g>
  <path class="e" d="M184 126 V148" marker-end="url(#a2)"/>
  <path class="e" d="M185 230 V344" marker-end="url(#a2)"/>

  <!-- contracts -->
  <text class="h" x="435" y="46" text-anchor="middle">shared contracts</text>
  <rect class="ctr" x="350" y="148" width="170" height="74" rx="5"/>
  <rect class="ctr" x="350" y="344" width="170" height="62" rx="5"/>
  <g text-anchor="middle">
    <text class="hm" x="435" y="169">schemas/</text>
    <text class="b" x="435" y="188">journey JSON Schema</text>
    <text class="b" x="435" y="205">(#1, #14)</text>
    <text class="hm" x="435" y="364">db/</text>
    <text class="b" x="435" y="382">schema and migrations</text>
    <text class="b" x="435" y="398">documents · indexes</text>
  </g>
  <path class="e r" d="M318 375 H350" marker-end="url(#a2)"/>
  <path class="e r" d="M552 375 H520" marker-end="url(#a2)"/>
  <path class="e r" d="M552 185 H520" marker-end="url(#a2)"/>
  <text class="sub" x="435" y="270" text-anchor="middle">the only link between</text>
  <text class="sub" x="435" y="285" text-anchor="middle">Python and TypeScript</text>

  <!-- matcher/ -->
  <rect class="lane-ts" x="536" y="24" width="454" height="400" rx="8"/>
  <text x="548" y="46"><tspan class="hm">matcher/</tspan><tspan class="b"> · TypeScript, pnpm workspace</tspan></text>
  <rect class="ts" x="552" y="64" width="210" height="62" rx="5"/>
  <rect class="ts" x="776" y="64" width="198" height="62" rx="5"/>
  <rect class="ts" x="552" y="148" width="148" height="74" rx="5"/>
  <rect class="ts" x="714" y="148" width="260" height="74" rx="5"/>
  <rect class="grp" x="552" y="236" width="422" height="86" rx="6"/>
  <text class="sub" x="560" y="250">algorithms/ · plug-ins, each implements both core interfaces</text>
  <rect class="alg" x="562" y="258" width="128" height="56" rx="5"/>
  <rect class="alg" x="704" y="258" width="128" height="56" rx="5"/>
  <rect class="alg" x="846" y="258" width="118" height="56" rx="5"/>
  <rect class="ts" x="552" y="344" width="128" height="62" rx="5"/>
  <rect class="ts" x="694" y="344" width="140" height="62" rx="5"/>
  <rect class="ts" x="846" y="344" width="128" height="62" rx="5"/>
  <g text-anchor="middle">
    <text class="hm" x="657" y="85">mcp-server</text>
    <text class="b" x="657" y="103">MCP tools and transport</text>
    <text class="b" x="657" y="119">server start, config</text>
    <text class="hm" x="875" y="85">indexer</text>
    <text class="b" x="875" y="103">CLI job, runs after</text>
    <text class="b" x="875" y="119">each crawl</text>
    <text class="hm" x="626" y="169">journey</text>
    <text class="b" x="626" y="188">parse and validate</text>
    <text class="b" x="626" y="205">journey state</text>
    <text class="hm" x="844" y="169">core</text>
    <text class="b" x="844" y="188">Matcher and Indexer interfaces</text>
    <text class="b" x="844" y="205">result model, error codes</text>
    <text class="hm" x="626" y="280">keyword</text>
    <text class="b" x="626" y="299">indexer + matcher</text>
    <text class="hm" x="768" y="280">graph</text>
    <text class="b" x="768" y="299">indexer + matcher</text>
    <text class="hm" x="905" y="280">ai-summary</text>
    <text class="b" x="905" y="299">indexer + matcher</text>
    <text class="hm" x="616" y="366">db</text>
    <text class="b" x="616" y="384">Postgres access</text>
    <text class="b" x="616" y="400">(pg)</text>
    <text class="hm" x="764" y="366">download</text>
    <text class="b" x="764" y="384">download(), one</text>
    <text class="b" x="764" y="400">fetcher per source</text>
    <text class="hm" x="910" y="366">llm</text>
    <text class="b" x="910" y="384">LLM and</text>
    <text class="b" x="910" y="400">embedding client</text>
  </g>
  <path class="e" d="M626 126 V148" marker-end="url(#a2)"/>
  <path class="e" d="M740 126 V148" marker-end="url(#a2)"/>
  <path class="e" d="M875 126 V148" marker-end="url(#a2)"/>
  <path class="e" d="M616 322 V344" marker-end="url(#a2)"/>
  <path class="e" d="M764 322 V344" marker-end="url(#a2)"/>
  <path class="e" d="M905 322 V344" marker-end="url(#a2)"/>

  <!-- dev only and reference -->
  <rect class="dev" x="34" y="440" width="486" height="56" rx="6"/>
  <rect class="dev" x="536" y="440" width="454" height="56" rx="6"/>
  <rect x="34" y="508" width="956" height="52" rx="6" fill="url(#hatch)" stroke="#9a9a9a" stroke-width="1.1"/>
  <g text-anchor="middle">
    <text class="hm" x="277" y="460">evaluation/</text>
    <text class="b" x="277" y="479">test journeys (#14) · relevance judgments · metrics runner (#11)</text>
    <text class="h" x="763" y="460">tests next to each package</text>
    <text class="b" x="763" y="479">pytest for crawler/ · Vitest for matcher/ · run in CI (#12)</text>
    <text class="hm" x="512" y="529">backend/</text>
    <text class="b" x="512" y="548">SS26 code copied in #13 · reference only, not built or deployed · reused parts move into crawler/ and matcher/ (table below)</text>
  </g>

  <!-- framework layer -->
  <text class="lab" x="34" y="586">FRAMEWORK LAYER · THIRD-PARTY LIBRARIES</text>
  <rect class="fw" x="34" y="596" width="300" height="62" rx="5"/>
  <rect class="fw" x="350" y="596" width="170" height="62" rx="5"/>
  <rect class="fw" x="536" y="596" width="454" height="62" rx="5"/>
  <g text-anchor="middle">
    <text class="b" x="184" y="616">Crawlee · httpx · Biopython · arxiv</text>
    <text class="b" x="184" y="633">google-api-python-client · feedparser</text>
    <text class="b" x="184" y="650">pydantic · asyncpg</text>
    <text class="b" x="435" y="621">full-text search</text>
    <text class="b" x="435" y="639">pgvector extension</text>
    <text class="b" x="763" y="621">MCP TypeScript SDK · zod · pg</text>
    <text class="b" x="763" y="639">@google/genai · openai (LLM clients)</text>
  </g>

  <!-- platform layer -->
  <text class="lab" x="34" y="684">PLATFORM LAYER</text>
  <rect class="pf" x="34" y="694" width="300" height="44" rx="5"/>
  <rect class="pf" x="350" y="694" width="170" height="44" rx="5"/>
  <rect class="pf" x="536" y="694" width="454" height="44" rx="5"/>
  <rect class="pf" x="34" y="748" width="956" height="40" rx="5"/>
  <g text-anchor="middle">
    <text class="h" x="184" y="721">Python 3.12 · uv</text>
    <text class="h" x="435" y="721">PostgreSQL 18</text>
    <text class="h" x="763" y="721">Node.js 24 LTS · pnpm</text>
    <text class="b" x="512" y="773">Docker Compose: one image per component · one command builds everything, one command starts the demo</text>
  </g>
</svg>
