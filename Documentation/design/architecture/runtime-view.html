    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      background: var(--color-paper);

      align-items: center;
      justify-content: center;

      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1136px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

        <title id="runtime-view-title">Runtime components of the Patient Journey Matcher</title>
        <desc id="runtime-view-desc">UML component diagram: the subsystem Patient Journey Matcher contains the crawler, the indexer, PostgreSQL and the MCP server. The indexer holds one indexer per approach (keyword, graph, ai_summary) and the MCP server one matcher per approach. The crawler requires the search APIs of the data sources, the indexer their file downloads and the annotations of PubTator3, both ai_summary parts the model API of an AI model service. Crawler, indexer and MCP server use PostgreSQL; the MCP server provides the MCP tools that an MCP client requires.</desc>
