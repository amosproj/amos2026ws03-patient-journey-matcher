<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1056 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-view-title code-view-desc" id="code-view-root">
        <title id="code-view-title">Code components of the Patient Journey Matcher</title>
        <desc id="code-view-desc">UML package diagram. Crawler (Python): cli uses runner and store; runner uses sources and links; links uses sources; store uses the SQL schema in db/init. Matcher (TypeScript) in three layers: the programs layer depends on the libraries layer; mcp-server, indexer and transcriber depend on approaches; evaluation uses the saved results of mcp-server; in the matching layer, approaches depends on the approaches keyword, graph and ai_summary in algorithms, and the matching layer depends on the libraries layer: core (interfaces Approach, Indexer, Matcher), db and download. db uses the SQL schema in db/init.</desc>
