      --color-ink:     #1f2328;
      --color-muted:   #57606a;
      --color-accent:  #1d5f8a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #code-view-root { font-family: var(--font-sans); color: var(--color-ink); }
      #code-view-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#code-view-root .diagram-container { overflow-x: visible; }
}</style>
