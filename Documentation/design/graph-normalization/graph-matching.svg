<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1056 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graph-matching-title graph-matching-desc" id="graph-matching-root">
        <title id="graph-matching-title">Graph matching</title>
        <desc id="graph-matching-desc">UML activity diagram of graph matching. Ahead of time, the indexer fetches the PubTator3 annotations of new papers and stores their concepts and relations in graph.documents, beside the MeSH headings. Per request, the matcher normalizes the patient into weighted concepts; PostgreSQL keeps the papers that name one of the patient's diagnoses and scores them by evidence, inverse document frequency and weight; the matcher re-ranks the best by their fit to the patient. Disease profiles plug into these generic steps, one per disease in PROFILES: prostate cancer, lung cancer, and a next disease as a JSON file in data/profiles and a module in src/profiles. The reading rules of all profiles go into normalizing the patient, the patient's diagnoses pick his profiles, and their ranking rules go into the re-rank, for each paper those of the profile of its disease.</desc>
<defs>
      <style>#graph-matching-root { --color-paper:   #fafafa;
      --color-ink:     #1f2328;
      --color-muted:   #57606a;
      --color-accent:  #1d5f8a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #graph-matching-root { font-family: var(--font-sans); color: var(--color-ink); }
      #graph-matching-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#graph-matching-root .diagram-container { overflow-x: visible; }
}</style>
