  <style>

      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1056px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

        <title id="graph-matching-title">Graph matching</title>
        <desc id="graph-matching-desc">UML activity diagram of graph matching. Ahead of time, the indexer fetches the PubTator3 annotations of new papers and stores their concepts and relations in graph.documents, beside the MeSH headings. Per request, the matcher normalizes the patient into weighted concepts; PostgreSQL keeps the papers that name one of the patient's diagnoses and scores them by evidence, inverse document frequency and weight; the matcher re-ranks the best by their fit to the patient. Disease profiles add the rules of one disease on top of the generic ones: the reading rules of all profiles when the patient is normalized, the ranking rules of the patient's diseases in the re-rank.</desc>
