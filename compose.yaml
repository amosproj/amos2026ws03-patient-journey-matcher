# One crawler container per source, all from crawler/Dockerfile. The command is the scheduled run
# (Documentation/build-deploy/deployment.md#scheduled-crawls), e.g. `docker compose run --rm crawler-pubmed`.
# The profile keeps them out of `docker compose up`, so `make db` starts the database only.
x-crawler: &crawler
  build: crawler
  image: amos-crawler
  profiles: [crawler]
  env_file:  # API keys
    - path: crawler/.env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    build: db  # the pgvector image plus pg_textsearch
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    container_name: amos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during initialisation the server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  crawler-pubmed:
    <<: *crawler
    command: [pubmed, --all-topics, --since, auto, --store, --max-results, "50", --max-depth, "0"]
  crawler-arxiv:
    <<: *crawler
    command: [arxiv, --all-topics, --since, auto, --store, --max-results, "3", --max-depth, "0"]
  crawler-zenodo:
    <<: *crawler
    command: [zenodo, --all-topics, --since, auto, --store, --max-results, "25"]
  crawler-youtube:
    <<: *crawler
    command: [youtube, --all-topics, --since, auto, --store, --max-results, "50"]
  crawler-podcast:
    <<: *crawler
    command: [podcast, --all-topics, --since, auto, --store, --max-results, "100"]
  # Not scheduled: PubMed again with the papers that two search results of a topic cite, which
  # takes more than a day (Documentation/build-deploy/deployment.md#crawl-the-cited-papers). --resume:
  # started again, it goes on.
  crawler-pubmed-references:
    <<: *crawler
    command: [pubmed, --all-topics, --resume, --store, --max-results, "50", --max-depth, "1",
              --min-citations, "2"]
  # The same for arXiv, but with every cited arXiv paper: a topic has few results there, and
  # what two of them cite are methods such as ResNet, which the topic filter drops anyway.
  crawler-arxiv-references:
    <<: *crawler
    command: [arxiv, --all-topics, --resume, --store, --max-results, "3", --max-depth, "1"]

volumes:
  pgdata:
