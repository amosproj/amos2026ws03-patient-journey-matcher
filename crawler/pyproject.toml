[project]
name = "crawler"
version = "0.1.0"
description = "Source crawlers that write document metadata to Postgres"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "crawlee>=1.11.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
