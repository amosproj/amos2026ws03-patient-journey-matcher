# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: sti_journal_podcast
    name: STI Podcast
    url: https://feed.podbean.com/stibmj/feed.xml
    publisher: BMJ Group
    audience: clinicians
    language: en
    trusted_because: Podcast of the peer-reviewed journal Sexually Transmitted Infections, published by BMJ.
  - key: asha_sex_plus_health
    name: Sex+Health
    url: https://rss.libsyn.com/shows/566590/destinations/4899740.xml
    publisher: American Sexual Health Association (ASHA)
    audience: patients
    language: en
    trusted_because: Podcast of ASHA, a US nonprofit for sexual health education, with experts on STIs and sexual health.
  - key: stashh_sexy_health
    name: Sexy Health with STASHH
    url: https://anchor.fm/s/c5eb1124/podcast/rss
    publisher: Students and Trainees Association for Sexual Health and HIV (STASHH)
    audience: clinicians
    language: en
    trusted_because: Podcast of STASHH, the trainee group affiliated with the British Association for Sexual Health and HIV (BASHH), on sexual health and HIV medicine.
