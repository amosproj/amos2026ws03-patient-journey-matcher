# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: stroke_alert
    name: Stroke Alert
    url: https://rss.libsyn.com/shows/324905/destinations/2642120.xml
    publisher: American Stroke Association (ASA)
    audience: clinicians
    language: en
    trusted_because: Monthly summary of the key papers in Stroke, the peer-reviewed journal of the American Stroke Association.
  - key: stronger_after_stroke
    name: Stronger After Stroke
    url: https://rss.libsyn.com/shows/467196/destinations/3950616.xml
    publisher: Norton Neuroscience Comprehensive Stroke Center and Resource Center (Norton Healthcare)
    audience: patients
    language: en
    trusted_because: Stroke survivors and specialists of a hospital stroke centre explain recovery, swallowing, caregiving and life after stroke.
  - key: enableme_podcast
    name: enableme podcast
    url: https://feeds.soundcloud.com/users/soundcloud:users:73707521/sounds.rss
    publisher: Stroke Foundation (Australia)
    audience: patients
    language: en
    trusted_because: Stroke survivors, health professionals and researchers share practical advice on recovery, from the Stroke Foundation, Australia's national stroke charity.
