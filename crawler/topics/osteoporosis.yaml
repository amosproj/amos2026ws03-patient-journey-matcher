  - key: osteoporosis_canada_unbreakable
    name: UNBREAKABLE - The OC Podcast
    url: https://feeds.blubrry.com/feeds/oc_podcast.xml
    publisher: Osteoporosis Canada
    audience: patients
    language: en
    trusted_because: Osteoporosis Canada's podcast with evidence-based information from health professionals and stories of people living with osteoporosis.
