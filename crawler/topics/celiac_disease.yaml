# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: celiac_canada_podcast
    name: A Canadian Celiac Podcast
    url: https://rss.libsyn.com/shows/114626/destinations/648333.xml
    publisher: Celiac Canada
    audience: patients
    language: en
    trusted_because: Podcast of Celiac Canada, the national charity for celiac disease, hosted by its dietitian and executive director since April 2026 (earlier episodes by a volunteer chapter president).
  - key: beyond_celiac_straight_talk
    name: Celiac Straight Talk
    url: https://rss.libsyn.com/shows/96591/destinations/497758.xml
    publisher: Beyond Celiac
    audience: patients
    language: en
    trusted_because: Official podcast of the patient-advocacy and research organisation Beyond Celiac, with real stories of living with celiac disease.
  - key: celiac_disease_foundation_inside_celiac
    name: Inside Celiac
    url: https://feed.podbean.com/InsideCeliac/feed.xml
    publisher: Celiac Disease Foundation
    audience: patients
    language: en
    trusted_because: Signature podcast of the Celiac Disease Foundation, the US patient organisation, with clinician interviews on diagnosis, treatment and research.
