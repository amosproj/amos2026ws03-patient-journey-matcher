# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: sepsis_alliance_sepsis_spectrum
    name: The Sepsis Spectrum
    url: https://feeds.megaphone.fm/sepsisspectrum
    publisher: Sepsis Alliance
    audience: clinicians
    language: en
    trusted_because: Official podcast of Sepsis Alliance, the US sepsis charity, on recognising and treating sepsis and on survivorship, hosted by a critical care nurse specialist.
  - key: uk_sepsis_trust_sepsis_voices
    name: Sepsis Voices with Dr Ron
    url: https://feed.podbean.com/SepsisVoices/feed.xml
    publisher: UK Sepsis Trust (UKST)
    audience: patients
    language: en
    trusted_because: Official podcast of the UK Sepsis Trust, the UK sepsis charity, with sepsis survivors, clinicians and campaigners on recognition, recovery and infection management.
