  - key: ms_trust_podcast
    name: The MS Trust podcast
    url: https://rss.buzzsprout.com/1801913.rss
    publisher: The Multiple Sclerosis Trust (MS Trust)
    audience: patients
    language: en
    trusted_because: Official podcast of the UK's MS Trust, with MS specialists and people living with MS on symptoms, treatment and daily life.
  - key: msaa_podcast
    name: MSAA Podcast
    url: https://mymsaa.org/feed/podcast/
    publisher: Multiple Sclerosis Association of America (MSAA)
    audience: patients
    language: en
    trusted_because: Official podcast of the Multiple Sclerosis Association of America, with medical professionals and MSAA staff.
