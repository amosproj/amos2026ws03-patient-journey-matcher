# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: nejm_this_week
    name: NEJM This Week
    url: https://podcast.nejm.org/nejm_audio_summaries.xml
    publisher: NEJM Group
    audience: clinicians
    language: en
    trusted_because: Weekly audio summaries of the peer-reviewed New England Journal of Medicine.
  - key: bmj_medicine_science
    name: Medicine and Science from The BMJ
    url: https://feed.podbean.com/thebmjpodcast/feed.xml
    publisher: BMJ
    audience: clinicians
    language: en
    trusted_because: Podcast of the peer-reviewed BMJ on medical research and practice.
  - key: jama_clinical_reviews
    name: JAMA Clinical Reviews
    url: https://jamaclinicalreviews.libsyn.com/rss
    publisher: JAMA Network
    audience: clinicians
    language: en
    trusted_because: Interviews on the clinical reviews of JAMA, the peer-reviewed journal of the American Medical Association.
  - key: bmj_best_practice
    name: BMJ Best Practice Podcast
    url: https://feed.podbean.com/bmjbestpractice/feed.xml
    publisher: BMJ Group
    audience: clinicians
    language: en
    trusted_because: Interviews with clinical experts from BMJ Best Practice, the evidence-based decision support of the peer-reviewed BMJ.
  - key: afp_podcast
    name: "AFP: American Family Physician Podcast"
    url: https://rss.libsyn.com/shows/80596/destinations/371783.xml
    publisher: American Academy of Family Physicians (AAFP)
    audience: clinicians
    language: en
    trusted_because: Audio summaries of American Family Physician, the peer-reviewed journal of the American Academy of Family Physicians.
  - key: annals_on_call
    name: Annals On Call Podcast
    url: https://media.acponline.org/feeds/annals-on-call.xml
    publisher: American College of Physicians (ACP)
    audience: clinicians
    language: en
    trusted_because: Experts discuss clinically influential articles of Annals of Internal Medicine, the peer-reviewed journal of the American College of Physicians.
  - key: lancet_voice
    name: The Lancet Voice
    url: https://feed.podbean.com/lancetvoice/feed.xml
    publisher: The Lancet Group
    audience: clinicians
    language: en
    trusted_because: Editors of the peer-reviewed Lancet journals discuss recent clinical and global health research.
  - key: cmaj_podcasts
    name: CMAJ Podcasts
    url: https://rss.buzzsprout.com/1815691.rss
    publisher: Canadian Medical Association Journal (CMAJ)
    audience: clinicians
    language: en
    trusted_because: Podcast of the peer-reviewed Canadian Medical Association Journal on clinical research and health care.
  - key: nice_talks
    name: NICE Talks
    url: https://feeds.soundcloud.com/users/soundcloud:users:118150081/sounds.rss
    publisher: National Institute for Health and Care Excellence (NICE)
    audience: clinicians
    language: en
    trusted_because: Official podcast of NICE, the national body that issues evidence-based guidance for health care in England.
  - key: mayo_clinic_talks
    name: Mayo Clinic Talks
    url: https://feed.podbean.com/mayoclinictalks/feed.xml
    publisher: Mayo Clinic
    audience: clinicians
    language: en
    trusted_because: Weekly clinical updates for primary care and specialist clinicians from Mayo Clinic physicians.
  - key: mayo_clinic_health_matters
    name: Mayo Clinic Health Matters
    url: https://feeds.megaphone.fm/ERTOE2188201511
    publisher: Mayo Clinic Press
    audience: patients
    language: en
    trusted_because: Health information for the public from Mayo Clinic experts, produced by Mayo Clinic Press.
  - key: cleveland_clinic_health_essentials
    name: Cleveland Clinic Health Essentials Podcast
    url: https://feeds.megaphone.fm/IAIIL7971610262
