# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: jco
    name: Journal of Clinical Oncology (JCO) Podcast
    url: https://jcopodcast.libsyn.com/rss
    publisher: American Society of Clinical Oncology (ASCO)
    audience: clinicians
    language: en
    trusted_because: Official podcast of ASCO's peer-reviewed Journal of Clinical Oncology.
  - key: cancer_net
    name: Cancer.Net Podcast
    url: https://cancernet.libsyn.com/rss
    publisher: American Society of Clinical Oncology (ASCO)
    audience: patients
    language: en
    trusted_because: ASCO's podcast for people with cancer; no new episodes since March 2024.
  - key: asco_daily_news
    name: ASCO Daily News
    url: https://ascodailynews.libsyn.com/rss
    publisher: American Society of Clinical Oncology (ASCO)
    audience: clinicians
    language: en
    trusted_because: ASCO's news podcast on oncology research and meetings.
  - key: lancet_oncology
    name: The Lancet Oncology in conversation with
    url: https://feed.podbean.com/lancetonc/feed.xml
    publisher: The Lancet Group
    audience: clinicians
    language: en
    trusted_because: Interviews from the peer-reviewed journal The Lancet Oncology.
  - key: asco_guidelines
    name: ASCO Guidelines
    url: https://feeds.libsyn.com/115284/rss
    publisher: American Society of Clinical Oncology (ASCO)
    audience: clinicians
    language: en
    trusted_because: ASCO's podcast with the expert panel members behind its evidence-based clinical practice guidelines.
  - key: esmo_podcasts
    name: ESMO Podcasts
    url: https://feeds.soundcloud.com/users/soundcloud:users:881879173/sounds.rss
    publisher: European Society for Medical Oncology (ESMO)
    audience: clinicians
    language: en
    trusted_because: Official ESMO podcasts with highlights from its peer-reviewed journals Annals of Oncology and ESMO Open and from its congresses.
  - key: cleveland_clinic_cancer_advances
    name: Cleveland Clinic Cancer Advances
    url: https://rss.buzzsprout.com/2241774.rss
    publisher: Cleveland Clinic Cancer Institute
    audience: clinicians
    language: en
    trusted_because: Specialists of the Cleveland Clinic Cancer Institute discuss new research and clinical advances in oncology.
  - key: macmillan_cancer_professionals
    name: The Cancer Professionals Podcast
    url: https://www.spreaker.com/show/6015348/episodes/feed
    publisher: Macmillan Cancer Support
    audience: clinicians
    language: en
    trusted_because: Macmillan Cancer Support, a UK cancer charity, interviews experts on clinical practice and care for people affected by cancer.
  - key: mdanderson_cancerwise
    name: Cancerwise Podcast
    url: https://support.doctorpodcasting.com/podcastfeed/335
    publisher: The University of Texas MD Anderson Cancer Center (MD Anderson)
    audience: patients
    language: en
    trusted_because: MD Anderson experts and cancer survivors discuss diagnosis, treatment, research and prevention for patients and caregivers.
  - key: roswell_park_smarter_than_cancer
    name: Smarter Than Cancer
    url: https://feeds.captivate.fm/smarter-than-cancer/
    publisher: Roswell Park Comprehensive Cancer Center (Roswell Park)
    audience: patients
    language: en
    trusted_because: Roswell Park clinicians and scientists answer common questions about cancer and its treatment.
