# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: acog_green_room
    name: "The Green Room: A Podcast from Obstetrics & Gynecology"
    url: https://feeds.feedburner.com/ObstetricsGynecologyPerspectives
    publisher: Obstetrics & Gynecology (Green Journal) of the American College of Obstetricians and Gynecologists (ACOG)
    audience: clinicians
    language: en
    trusted_because: Podcast of Obstetrics & Gynecology, the peer-reviewed Green Journal of ACOG, with interviews on its latest articles and ACOG guidance.
  - key: rcog_podcast
    name: RCOG Podcast
    url: https://feeds.soundcloud.com/users/soundcloud:users:202475628/sounds.rss
    publisher: Royal College of Obstetricians and Gynaecologists (RCOG)
    audience: clinicians
    language: en
    trusted_because: Official podcast of the RCOG, the UK professional body for obstetrics and gynaecology; surgical-skills series and The Obstetrician & Gynaecologist journal podcasts.
  - key: smfm_podcast_series
    name: "SMFM's Podcast Series"
    url: https://smfm2018.libsyn.com/rss
    publisher: Society for Maternal-Fetal Medicine (SMFM)
    audience: clinicians
    language: en
    trusted_because: Official podcast of the SMFM, the society of maternal-fetal medicine specialists, on high-risk pregnancy care and its consult series.
  - key: ims_podcast
    name: International Menopause Society Podcast
    url: https://feed.podbean.com/internationalmenopausesociety/feed.xml
    publisher: International Menopause Society (IMS)
    audience: clinicians
    language: en
    trusted_because: Interviews with menopause experts from the IMS, the international professional society for menopause and midlife health; many episodes come in a version for women.
  - key: emas_podcast_series
    name: EMAS Podcast Series
    url: https://rss.buzzsprout.com/2006490.rss
    publisher: European Menopause and Andropause Society (EMAS)
    audience: clinicians
    language: en
    trusted_because: Official podcast of EMAS, the European society behind the journal Maturitas, on menopause care; newest episode September 2025.
  - key: asrm_fertility_and_sterility_on_air
    name: Fertility and Sterility On Air
    url: https://rss.libsyn.com/shows/297920/destinations/2353235.xml
    publisher: American Society for Reproductive Medicine (ASRM)
    audience: clinicians
    language: en
    trusted_because: Podcast of Fertility and Sterility, the peer-reviewed journal of the ASRM, with author interviews on reproductive medicine.
  - key: asrm_today
    name: ASRM Today Podcast
    url: https://rss.libsyn.com/shows/181937/destinations/1243742.xml
    publisher: American Society for Reproductive Medicine (ASRM)
    audience: clinicians
    language: en
    trusted_because: Official podcast of the ASRM on fertility care, family building and reproductive health policy.
  - key: npwh_her_health_matters
    name: Her Health Matters
    url: https://feed.podbean.com/npwh/feed.xml
    publisher: National Association of Nurse Practitioners in Women's Health (NPWH)
    audience: clinicians
    language: en
    trusted_because: Official podcast of the NPWH, the professional association of women's health nurse practitioners, on menopause, pregnancy and gynaecological care.
  - key: jean_hailes_podcast
    name: The Jean Hailes podcast
    url: https://jeanhailespod.libsyn.com/rss
    publisher: Jean Hailes for Women's Health
    audience: patients
    language: en
    trusted_because: Podcast of Jean Hailes for Women's Health, an Australian not-for-profit that turns research into health information for women; newest episode December 2024.
