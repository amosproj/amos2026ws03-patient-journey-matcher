# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: pkd_chronicles
    name: "PKD Chronicles: Navigating Life with Polycystic Kidney Disease"
    url: https://rss.libsyn.com/shows/579545/destinations/5022995.xml
    publisher: PKD Foundation
    audience: patients
    language: en
    trusted_because: Produced by the PKD Foundation, the US charity for polycystic kidney disease, with clinicians and people living with the disease.
  - key: pdi_pd_exchange
    name: "The #PDExchange Podcast"
    url: https://anchor.fm/s/9f104d44/podcast/rss
    publisher: Peritoneal Dialysis International (PDI)
    audience: clinicians
    language: en
    trusted_because: Podcast of the peer-reviewed journal Peritoneal Dialysis International, listed by the International Society for Peritoneal Dialysis.
  - key: nkfi_journey_continues
    name: The Journey Continues
    url: https://feeds.transistor.fm/the-journey-continues
    publisher: National Kidney Foundation of Illinois (NKFI)
    audience: patients
    language: en
    trusted_because: Podcast of the National Kidney Foundation of Illinois, a kidney charity, with patients, living donors and care teams sharing their experience.
