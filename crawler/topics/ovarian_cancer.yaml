# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: teal_talk_ovarian_cancer
    name: Teal Talk–An Ovarian Cancer Podcast
    url: https://feed.podbean.com/tealtalk/feed.xml
    publisher: National Ovarian Cancer Coalition (NOCC)
    audience: patients
    language: en
    trusted_because: The National Ovarian Cancer Coalition, a US ovarian cancer patient organisation, discusses risk, genetic testing, treatment advances and follow-up care with survivors and experts.
  - key: gosh_podcast
    name: GOSH Podcast
    url: https://rss.buzzsprout.com/1387837.rss
    publisher: Gynecologic Cancer Initiative (GCI)
    audience: patients
    language: en
    trusted_because: The Gynecologic Cancer Initiative, a British Columbia research and care network with patient partners, discusses gynecologic cancer research alongside lived experience; it covers all gynaecological cancers.
  - key: gog_gyn_live
    name: GOG GYN-LIVE
    url: https://feeds.transistor.fm/gog-gyn-live
    publisher: The GOG Foundation
    audience: clinicians
    language: en
    trusted_because: The GOG Foundation, a non-profit gynecologic cancer clinical trials organisation, reports trial updates and drug approvals with the investigators; it covers all gynaecological cancers.
