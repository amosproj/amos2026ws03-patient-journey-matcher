# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: chadd_all_things_adhd
    name: All Things ADHD
    url: https://podcasts.chadd.org/feed.xml
    publisher: Children and Adults with Attention-Deficit/Hyperactivity Disorder (CHADD)
    audience: patients
    language: en
    trusted_because: Official podcast of CHADD, the national nonprofit for people with ADHD, with expert interviews on ADHD across the lifespan.
  - key: adhd_uk_podcast
    name: ADHDUK podcast
    url: https://api.riverside.com/hosting/yhBgIXYF.rss
    publisher: ADHD UK
    audience: patients
    language: en
    trusted_because: Official podcast of the charity ADHD UK, presented by its trustees and ambassadors, among them a paediatrician, with clinicians and researchers as guests.
