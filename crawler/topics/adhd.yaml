# Seeds for one disease area. Schema: crawler/README.md#topic-files
id: adhd
label: ADHD

# A cited paper is kept only if one of these terms is in its title, abstract or keywords.
terms:
  - ADHD
  - attention deficit hyperactivity disorder
  - attention deficit and hyperactivity disorder
  - Attention Deficit Disorder with Hyperactivity
  - attention deficit disorder
  - hyperkinetic disorder

# PubMed, arXiv and Zenodo search queries.
queries:
  # Disease
  - ADHD
  - attention deficit hyperactivity disorder
  - adult ADHD
  - ADHD in children
  - ADHD in adolescents
  - ADHD in women
  - ADHD predominantly inattentive
  - ADHD comorbidity
  - ADHD substance use disorder
  # Diagnosis and screening
  - ADHD diagnosis
  - ADHD screening
  - ADHD adult self-report scale
  - ADHD Conners rating scale
  - ADHD diagnostic interview
  - ADHD differential diagnosis
  - adult ADHD late diagnosis
  # Treatment
  - ADHD treatment guidelines
  - ADHD stimulant medication
  - ADHD methylphenidate
  - ADHD lisdexamfetamine
  - ADHD dexamfetamine
  - ADHD atomoxetine
  - ADHD guanfacine
  - ADHD clonidine
  - ADHD non-stimulant medication
  - ADHD medication side effects
  - ADHD medication pregnancy
  - ADHD behavioral parent training
  - ADHD cognitive behavioral therapy
  - ADHD psychoeducation
  - ADHD school interventions
  # Living with
  - ADHD school performance
  - ADHD college students
  - ADHD employment
  - ADHD relationships
  - ADHD quality of life
  - ADHD parenting stress
  - ADHD long-term outcomes
  - ADHD transition adult services

