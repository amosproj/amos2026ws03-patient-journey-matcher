# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: brain_tumour_charity_lets_talk_about_brain_tumours
    name: Let's Talk About Brain Tumours
    url: https://rss.buzzsprout.com/1727640.rss
    publisher: The Brain Tumour Charity
    audience: patients
    language: en
    trusted_because: Podcast of The Brain Tumour Charity, a UK charity that funds brain tumour research and supports patients, with people affected by brain tumours, researchers and advocates on diagnosis, treatment and support.
  - key: neuro_oncology_the_podcast
    name: "Neuro-Oncology: The Podcast"
    url: https://soc-neuro-onc.libsyn.com/rss
    publisher: Society for Neuro-Oncology (SNO)
    audience: clinicians
    language: en
    trusted_because: Official podcast of the Society for Neuro-Oncology, with author interviews on papers from its peer-reviewed journal Neuro-Oncology and conversations with leading clinicians and scientists.
  - key: ivy_brain_tumor_center_brain_tumor_talk
    name: Brain Tumor Talk
    url: https://rss.buzzsprout.com/2362848.rss
    publisher: Ivy Brain Tumor Center
    audience: patients
    language: en
    trusted_because: Podcast of the Ivy Brain Tumor Center, a brain tumor research and treatment centre at the Barrow Neurological Institute, with specialists, survivors and caregivers; no new episodes since January 2025.
