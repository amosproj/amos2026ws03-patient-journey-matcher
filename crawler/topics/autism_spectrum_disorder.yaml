# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: asf_weekly_science_report
    name: Autism Science Foundation Weekly Science Report
    url: https://asfpodcast.org/feed/podcast/
    publisher: Autism Science Foundation (ASF)
    audience: patients
    language: en
    trusted_because: Official podcast of the Autism Science Foundation, a research charity, summarising the week's autism research findings.
  - key: aspect_a_different_brilliant
    name: A Different Brilliant
    url: https://feeds.captivate.fm/a-different-brilliant/
    publisher: Autism Spectrum Australia (Aspect)
    audience: patients
    language: en
    trusted_because: Podcast of Aspect, an Australian autism charity, for autistic adults and for parents and carers of autistic children, with experts and guests from the autism community.
  - key: middletown_autism_podcast
    name: The Middletown Centre for Autism Podcast
    url: https://rss.buzzsprout.com/1184276.rss
    publisher: Middletown Centre for Autism
    audience: patients
    language: en
    trusted_because: Podcast of the Middletown Centre for Autism, set up by the education departments of Ireland and Northern Ireland, with autism-affirming interviews on education and lived experience.
