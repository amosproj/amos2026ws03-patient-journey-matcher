# Seeds for one disease area. Schema: crawler/README.md#topic-files
id: autism_spectrum_disorder
label: Autism

# A cited paper is kept only if one of these terms is in its title, abstract or keywords.
terms:
  - autism
  - autistic
  - autism spectrum disorder
  - autism spectrum condition
  - autistic disorder
  - Asperger syndrome
  - Asperger's syndrome
  - Child Development Disorders, Pervasive
  - pervasive developmental disorder

# PubMed, arXiv and Zenodo search queries.
