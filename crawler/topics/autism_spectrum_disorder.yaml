  # Disease
  - autism spectrum disorder
  - autism in children
  - autism in adults
  - autistic adults
  - autistic girls and women
  - autism spectrum condition
  - Asperger syndrome
  - autism intellectual disability
  - autism ADHD
  - autism anxiety
  - autism epilepsy
  - autism sleep problems
  - autism gastrointestinal problems
  # Diagnosis and screening
  - autism screening toddlers
  - autism M-CHAT
  - autism diagnosis children
  - autism diagnosis adults
  - autism diagnostic observation schedule
  - autism late diagnosis
  - autism genetic testing
  # Treatment
  - autism early intervention
  - autism Denver model
  - autism parent-mediated intervention
  - autism social communication intervention
  - autism applied behavior analysis
  - autism speech language therapy
  - autism occupational therapy
  - autism cognitive behavioral therapy
  - autism risperidone
  - autism aripiprazole
  - autism melatonin
  # Living with
