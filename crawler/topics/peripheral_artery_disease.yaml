# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: audible_bleeding
    name: Audible Bleeding
    url: https://audiblebleeding.libsyn.com/rss
    publisher: Society for Vascular Surgery (SVS)
    audience: clinicians
    language: en
    trusted_because: Interviews, journal author spotlights and landmark paper reviews for vascular surgeons, from the Society for Vascular Surgery.
  - key: esvs_podcast
    name: European Society for Vascular Surgery
    url: https://media.rss.com/esvs/feed.xml
    publisher: European Society for Vascular Surgery (ESVS)
    audience: clinicians
    language: en
    trusted_because: Podcast of the European Society for Vascular Surgery on its guidelines, trials and techniques for arterial, venous and aortic disease.
  - key: aha_pad_podcast_series
    name: Peripheral Artery Disease (PAD) Podcast Series
    url: https://rss.libsyn.com/shows/421328/destinations/3500081.xml
    publisher: American Heart Association (AHA)
    audience: clinicians
    language: en
    trusted_because: Series by the American Heart Association for health care professionals on PAD screening, lifestyle change, wound care and foot care.
