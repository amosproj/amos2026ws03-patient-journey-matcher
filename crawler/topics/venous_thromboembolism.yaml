podcasts:
  - key: taking_a_breath_stop_the_clot
    name: "Taking a Breath: A Stop the Clot Podcast"
    url: https://feeds.transistor.fm/stop-the-clot
    publisher: National Blood Clot Alliance (NBCA)
    audience: patients
    language: en
    trusted_because: Survivor stories about blood clots from the National Blood Clot Alliance, a US patient organisation that raises awareness of clot risks and symptoms.
  - key: clot_conversations
    name: CLOT Conversations
    url: https://rss.buzzsprout.com/1946680.rss
    publisher: Thrombosis Canada
    audience: clinicians
    language: en
    trusted_because: Thrombosis Canada, the national network of thrombosis experts behind the Canadian clinical guides, discusses new trials and guidelines in thrombosis and anticoagulation.
