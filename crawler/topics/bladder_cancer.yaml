# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: bladder_cancer_matters
    name: Bladder Cancer Matters
    url: https://bladdercancer.libsyn.com/rss
    publisher: Bladder Cancer Advocacy Network (BCAN)
    audience: patients
    language: en
    trusted_because: BCAN, the leading US bladder cancer patient organisation, interviews patients, urologists and researchers on diagnosis, treatment and life after bladder cancer.
  - key: bladder_cancer_canada_podcast
    name: The Bladder Cancer Canada Podcast
    url: https://rss.buzzsprout.com/1789063.rss
    publisher: Bladder Cancer Canada
    audience: patients
    language: en
    trusted_because: Bladder Cancer Canada, the national bladder cancer patient charity, shares patient experiences and expert advice on treatment and life with bladder cancer.
