# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: addiction_audio
    name: Addiction Audio
    url: https://feeds.acast.com/public/shows/addiction-audio
    publisher: Society for the Study of Addiction (SSA)
    audience: clinicians
    language: en
    trusted_because: Podcast of the peer-reviewed journal Addiction, published for the Society for the Study of Addiction, with interviews of the authors of new studies.
  - key: asam_beyond_the_abstract
    name: "Addiction Medicine: Beyond the Abstract"
    url: https://feed.podbean.com/journal/feed.xml
    publisher: American Society of Addiction Medicine (ASAM)
    audience: clinicians
    language: en
    trusted_because: Podcast of the Journal of Addiction Medicine, the peer-reviewed journal of ASAM, in which hosts interview the authors of published articles.
  - key: smart_recovery_podcast
    name: SMART Recovery Podcast
    url: https://rss.libsyn.com/shows/28203/destinations/53107.xml
    publisher: SMART Recovery
    audience: patients
    language: en
    trusted_because: Official podcast of SMART Recovery, an established peer-support organisation for addiction recovery, with talks by experts in science-based treatment and recovery.
