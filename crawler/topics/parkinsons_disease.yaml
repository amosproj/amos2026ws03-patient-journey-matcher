    audience: patients
    language: en
    trusted_because: Official podcast of the Michael J. Fox Foundation, a major Parkinson's research funder, with researchers, clinicians and patients, including webinar audio.
  - key: davis_phinney_parkinsons_podcast
    name: The Parkinson's Podcast
    url: https://rss.libsyn.com/shows/129789/destinations/786457.xml
