    audience: patients
    language: en
    trusted_because: Official podcast of the Parkinson's Foundation, with Parkinson's experts on treatment, research, exercise and living well.
  - key: mjff_parkinsons_podcast
    name: The Michael J. Fox Foundation Parkinson's Podcast
    url: https://feeds.captivate.fm/mjff/
