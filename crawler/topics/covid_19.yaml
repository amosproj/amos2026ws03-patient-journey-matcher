# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: jama_coronavirus_covid_19_qa
    name: Coronavirus (COVID-19) Q&A
    url: https://covid19jama.libsyn.com/rss
    publisher: JAMA Network
    audience: clinicians
    language: en
    trusted_because: Editors of the JAMA Network interview experts and authors of COVID-19 research, from the publisher of the peer-reviewed journal JAMA.
