    url: https://www.youtube.com/channel/UC1QrPVA6-tihibHVLKIELSA
  - name: American Society of Pediatric Otolaryngology (ASPO)
    url: https://www.youtube.com/channel/UCOJnGzc5_X7Ir5T-RXjGerg
  - name: Stanford Otolaryngology-Head and Neck Surgery
    url: https://www.youtube.com/channel/UC5oJcoImmxwCMuSvSugpJtg
  - name: American Tinnitus Association (ATA)
