# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: lcfa_hope_with_answers
    name: "Hope With Answers: Living With Lung Cancer"
    url: https://feed.podbean.com/hopewithanswers/feed.xml
    publisher: Lung Cancer Foundation of America (LCFA)
    audience: patients
    language: en
    trusted_because: LCFA, a US lung cancer charity, talks with oncologists, nurses and people living with lung cancer about biomarkers, treatment options and life after diagnosis.
  - key: lungevity_voices_of_hope
    name: Lung Cancer Voices of Hope
    url: https://media.rss.com/lungcancervoicesofhope/feed.xml
    publisher: LUNGevity Foundation
    audience: patients
    language: en
    trusted_because: LUNGevity Foundation, a US lung cancer research and patient-support nonprofit, brings people living with lung cancer together with oncologists and nurses.
  - key: roy_castle_talk_of_hope
    name: Talk of Hope
    url: https://anchor.fm/s/be538edc/podcast/rss
    publisher: Roy Castle Lung Cancer Foundation
    audience: patients
    language: en
    trusted_because: Roy Castle Lung Cancer Foundation, the UK lung cancer charity, shares patient stories and expert advice on screening, treatment and living with lung cancer.
