# Podcast feeds. `key` is part of every episode ID: keep it stable, never reuse it.
podcasts:
  - key: aaaai_conversations_from_the_world_of_allergy
    name: "AAAAI Podcast: Conversations from the World of Allergy"
    url: https://rss.buzzsprout.com/2049216.rss
    publisher: American Academy of Allergy, Asthma & Immunology (AAAAI)
    audience: clinicians
    language: en
    trusted_because: Official podcast of the AAAAI, the professional society of allergists and immunologists in the United States.
  - key: csaci_the_allergist
    name: The Allergist
    url: https://rss.buzzsprout.com/2250841.rss
    publisher: Canadian Society of Allergy and Clinical Immunology (CSACI)
    audience: clinicians
    language: en
    trusted_because: Official podcast of CSACI, the professional society of allergists and clinical immunologists in Canada, hosted by a physician.
  - key: anaphylaxis_uk_lets_talk_about_allergies
    name: "Anaphylaxis UK: Let's Talk About Allergies"
    url: https://media.rss.com/letstalkaboutallergies/feed.xml
    publisher: Anaphylaxis UK (now part of Allergy UK)
    audience: patients
    language: en
    trusted_because: Podcast of the UK allergy charity Anaphylaxis UK, with allergy specialists and people living with allergies.
