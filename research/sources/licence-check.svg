<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1056 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="licence-check-title licence-check-desc" id="licence-check-root">
        <title id="licence-check-title">Licence check proposed in #6</title>
        <desc id="licence-check-desc">UML activity diagram of the licence check proposed in #6: the crawler stores each record with its licence; when a use needs the full text, the indexer downloads it only if the licence allows the use and the licence in the file still allows it, and otherwise uses the metadata only.</desc>
<defs>
      <style>#licence-check-root { --color-paper:   #fafafa;
      --color-ink:     #1f2328;
      --color-muted:   #57606a;
      --color-accent:  #1d5f8a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #licence-check-root { font-family: var(--font-sans); color: var(--color-ink); }
      #licence-check-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#licence-check-root .diagram-container { overflow-x: visible; }
}</style>
  <marker id="licence-check-open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,5 L 1,9" fill="none" stroke="#57606a" stroke-width="1.2"/></marker>
  <marker id="licence-check-open-solid" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1,1 L 9,5 L 1,9" fill="none" stroke="#57606a" stroke-width="1.2"/></marker>
</defs>
